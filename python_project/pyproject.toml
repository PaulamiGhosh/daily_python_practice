[project]
name = "python-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.2",
    "lab>=8.10",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
]

[project.scripts]
python-project = "python_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
